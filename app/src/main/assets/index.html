<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DSPOT</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: transparent; color: white; user-select: none;
        }
        
        /* Contenedores de la escena 3D */
        #scene { 
            perspective: 800px; 
            width: 100vw; height: 100vh; 
            position: absolute; top: 0; left: 0;
            display: flex; align-items: center; justify-content: center;
        }
        #world { 
            transform-style: preserve-3d; 
            width: 0; height: 0; 
            transition: transform 0.1s ease-out;
        }
        
        /* Diseño de la Ventana (Estilo Mac OS flotante) */
        .window {
            position: absolute;
            width: 320px;
            background: rgba(10, 10, 20, 0.75);
            border: 1px solid rgba(29, 185, 84, 0.3);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 0 20px rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transform-style: preserve-3d;
            transition: border-color 0.3s;
            /* Centro de origen para las transformaciones espaciales */
            left: -160px; top: -120px;
        }
        .window:active { border-color: rgba(29, 185, 84, 0.8); }
        
        /* Barra superior para arrastrar */
        .drag-bar {
            width: 100%; height: 24px;
            margin-bottom: 10px; margin-top: -10px;
            display: flex; align-items: center; justify-content: center;
            cursor: grab;
        }
        .drag-line { width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        
        /* Textos */
        h2 { font-size: 13px; margin: 0 0 15px 0; color: #1DB954; text-transform: uppercase; letter-spacing: 2px;}
        .track-title { font-size: 20px; font-weight: bold; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .track-artist { font-size: 15px; color: rgba(255,255,255,0.6); margin: 0 0 24px 0; }
        
        /* Botones */
        .controls { display: flex; justify-content: space-between; align-items: center; padding: 0 10px;}
        button {
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 54px; height: 54px; border-radius: 27px;
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s, background 0.2s;
        }
        button:active { transform: scale(0.9); }
        .btn-play { background: #1DB954; color: black; width: 68px; height: 68px; border-radius: 34px; font-size: 28px; box-shadow: 0 0 20px rgba(29, 185, 84, 0.4);}
        .btn-large { width: 100%; border-radius: 12px; height: 48px; background: #1DB954; color: black; font-weight: bold; font-size: 15px; margin-top: 10px; box-shadow: 0 0 15px rgba(29, 185, 84, 0.2); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); box-shadow: none; margin-bottom: 5px;}

        /* Posiciones iniciales en el espacio 3D */
        #login-panel { transform: translate3d(250px, -40px, -200px) rotateY(-25deg); }
        #player-panel { transform: translate3d(-180px, 40px, 150px) rotateY(15deg); display: none; }
    </style>
</head>
<body>

<div id="scene">
    <div id="world">
        
        <div id="login-panel" class="window">
            <div class="drag-bar"><div class="drag-line"></div></div>
            <h2>Acceso a Sistema</h2>
            <div class="track-artist">Conecta Spotify para iniciar la terminal holográfica de música.</div>
            <button class="btn-large btn-secondary" onclick="Android.openSpotifyApp()">1. Abrir Spotify primero</button>
            <button class="btn-large" onclick="Android.login()">2. Conectar Spotify</button>
        </div>

        <div id="player-panel" class="window">
            <div class="drag-bar"><div class="drag-line"></div></div>
            <h2>Reproduciendo</h2>
            <div class="track-title" id="t-name">Buscando señal...</div>
            <div class="track-artist" id="t-artist">-</div>
            <div class="controls">
                <button onclick="Android.skipPrev()">⏮</button>
                <button class="btn-play" id="btn-play" onclick="Android.playPause()">▶</button>
                <button onclick="Android.skipNext()">⏭</button>
            </div>
        </div>

    </div>
</div>

<script>
    /* ================= ROTACIÓN DEL ENTORNO 3D ================= */
    let isDraggingWorld = false;
    let startX, startY;
    let rotX = 0, rotY = 0;

    document.getElementById('scene').addEventListener('touchstart', e => {
        if (e.target.closest('.window')) return; // Si toca una ventana, no rotar todo el mundo
        isDraggingWorld = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    });

    document.getElementById('scene').addEventListener('touchmove', e => {
        if (!isDraggingWorld) return;
        let dx = e.touches[0].clientX - startX;
        let dy = e.touches[0].clientY - startY;
        
        rotY += dx * 0.4;
        rotX -= dy * 0.4;
        
        if (rotX > 35) rotX = 35;   // Límite arriba
        if (rotX < -35) rotX = -35; // Límite abajo

        document.getElementById('world').style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        
        // Enviamos la orden a Kotlin para que rote también el motor OpenGL (las estrellas)
        if(window.Android) { window.Android.rotateGalaxy(dx, dy); }
        
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    });

    document.getElementById('scene').addEventListener('touchend', () => isDraggingWorld = false);

    /* ================= ARRASTRAR VENTANAS EN EL ESPACIO ================= */
    let activeWindow = null;
    let winStartX, winStartY;
    let initialTransform = '';

    document.querySelectorAll('.window').forEach(win => {
        win.querySelector('.drag-bar').addEventListener('touchstart', e => {
            activeWindow = win;
            winStartX = e.touches[0].clientX;
            winStartY = e.touches[0].clientY;
            initialTransform = win.style.transform || window.getComputedStyle(win).transform;
        });
    });

    document.addEventListener('touchmove', e => {
        if (!activeWindow) return;
        let dx = e.touches[0].clientX - winStartX;
        let dy = e.touches[0].clientY - winStartY;
        
        // Sumamos el arrastre a la posición 3D actual
        activeWindow.style.transform = initialTransform + ` translate3d(${dx}px, ${dy}px, 0px)`;
    });

    document.addEventListener('touchend', () => {
        if (activeWindow) {
            // Guardamos la nueva posición como permanente al soltar
            let finalT = activeWindow.style.transform;
            activeWindow.style.transform = finalT;
            activeWindow = null;
        }
    });

    /* ================= PUENTE DE COMUNICACIÓN CON KOTLIN ================= */
    function setConnected(isConnected) {
        if(isConnected) {
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('player-panel').style.display = 'block';
        }
    }

    function updateTrack(name, artist, isPlaying) {
        document.getElementById('t-name').innerText = name;
        document.getElementById('t-artist').innerText = artist;
        document.getElementById('btn-play').innerText = isPlaying ? "⏸" : "▶";
    }
</script>
</body>
  </html>
