workflows:
  android-workflow:
    name: Build 3dspot APK
    max_build_duration: 30
    environment:
      groups:
        - spotify_keys
    scripts:
      - name: Build APK
        script: |
          # 1. Diagnóstico: Listamos todo para ver dónde estamos
          echo "--- Estructura de archivos actual ---"
          ls -R
          
          # 2. Buscamos el archivo gradlew de forma recursiva y entramos a su carpeta
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: No se encontró el archivo gradlew en ningún lado."
            exit 1
          fi
          
          cd "$(dirname "$GRADLEW_PATH")"
          echo "Cambiando al directorio: $(pwd)"
          
          # 3. Permisos y reemplazo de ID de Spotify
          chmod +x gradlew
          
          # Buscamos el archivo SpotifyManager.kt para no errar con la ruta
          SPOTIFY_FILE=$(find . -name "SpotifyManager.kt" | head -n 1)
          if [ ! -z "$SPOTIFY_FILE" ]; then
            sed -i '' "s/SPOTIFY_CLIENT_ID_PLACEHOLDER/$SPOTIFY_CLIENT_ID/g" "$SPOTIFY_FILE"
          fi
          
          # 4. Ejecución del build
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
