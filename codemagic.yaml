workflows:
  android-workflow:
    name: Build 3dspot APK
    max_build_duration: 30
    environment:
      groups:
        - spotify_keys # <--- ESTO CARGA TUS VARIABLES DEL GRUPO
    scripts:
      - name: Build APK
        script: |
          # Entramos a la subcarpeta del proyecto
          cd 3dspot
          
          # Damos permisos
          chmod +x gradlew
          
          # Reemplazamos el ID. El '' después de -i es vital para que funcione en los servers de Codemagic
          sed -i '' "s/SPOTIFY_CLIENT_ID_PLACEHOLDER/$SPOTIFY_CLIENT_ID/g" app/src/main/java/com/galaxy/dspot/SpotifyManager.kt
          
          # Compilamos
          ./gradlew assembleDebug
    artifacts:
      - 3dspot/app/build/outputs/apk/debug/*.apk
