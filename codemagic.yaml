workflows:
  android-workflow:
    name: Build 3dspot APK
    max_build_duration: 30
    environment:
      groups:
        - spotify_keys
    scripts:
      - name: Build APK
        script: |
          # 1. Generamos el Gradle Wrapper automáticamente porque no está en el repo
          gradle wrapper
          
          # 2. Le damos permisos de ejecución al archivo recién creado
          chmod +x gradlew
          
          # 3. Buscamos SpotifyManager.kt y reemplazamos el ID
          # Sintaxis sed para Codemagic (macOS)
          export SPOTIFY_FILE=$(find . -name "SpotifyManager.kt" | head -n 1)
          sed -i "" "s/SPOTIFY_CLIENT_ID_PLACEHOLDER/$SPOTIFY_CLIENT_ID/g" "$SPOTIFY_FILE"
          
          # 4. Compilación
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
