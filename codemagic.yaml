workflows:
  android-workflow:
    name: Build 3dspot APK
    max_build_duration: 30
    environment:
      groups:
        - spotify_keys
    scripts:
      - name: Build APK
        script: |
          # 1. Buscamos dónde quedó el archivo build.gradle de la raíz
          # y nos movemos ahí para que las rutas sean relativas a él.
          MAIN_DIR=$(find . -name "build.gradle" -not -path "*/app/*" -exec dirname {} + | head -n 1)
          cd "$MAIN_DIR"
          
          # 2. Corregimos permisos y placeholders usando rutas relativas
          chmod +x gradlew
          sed -i '' "s/SPOTIFY_CLIENT_ID_PLACEHOLDER/$SPOTIFY_CLIENT_ID/g" app/src/main/java/com/galaxy/dspot/SpotifyManager.kt
          
          # 3. Compilamos
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
      
