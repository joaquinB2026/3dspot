workflows:
  android-workflow:
    name: Build 3dspot APK
    max_build_duration: 30
    environment:
      groups:
        - spotify_keys
    scripts:
      - name: Build APK
        script: |
          # 1. Buscamos la carpeta que contiene el archivo build.gradle (la raíz real)
          ROOT_DIR=$(find . -name "build.gradle" -exec dirname {} + | head -n 1)
          cd "$ROOT_DIR"
          
          # 2. Damos permisos al gradlew de esa carpeta
          chmod +x gradlew
          
          # 3. Inyectamos la llave de Spotify
          sed -i '' "s/SPOTIFY_CLIENT_ID_PLACEHOLDER/$SPOTIFY_CLIENT_ID/g" app/src/main/java/com/galaxy/dspot/SpotifyManager.kt
          
          # 4. Ejecutamos el build desde la raíz confirmada
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
