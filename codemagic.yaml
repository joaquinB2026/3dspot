workflows:
  android-workflow:
    name: Build 3dspot APK
    max_build_duration: 30
    environment:
      groups:
        - spotify_keys
    scripts:
      - name: Build APK
        script: |
          # Forzamos a la máquina a pararse donde está el código
          cd $FLET_DEST_DIR 2>/dev/null || cd $CM_BUILD_DIR
          
          # Buscamos el archivo gradlew esté donde esté y le damos permiso
          find . -name "gradlew" -exec chmod +x {} +
          
          # Buscamos SpotifyManager.kt y reemplazamos el ID
          find . -name "SpotifyManager.kt" -exec sed -i '' "s/SPOTIFY_CLIENT_ID_PLACEHOLDER/$SPOTIFY_CLIENT_ID/g" {} +
          
          # Ejecutamos el build buscando el gradlew automáticamente
          $(find . -name "gradlew") assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
