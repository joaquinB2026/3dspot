workflows:
  android-workflow:
    name: Build 3dspot APK
    max_build_duration: 30
    scripts:
      - name: Build APK
        script: |
          chmod +x gradlew
          # Usamos las variables que cargaste en el panel de Codemagic
          sed -i "s/SPOTIFY_CLIENT_ID_PLACEHOLDER/$SPOTIFY_CLIENT_ID/g" app/src/main/java/com/galaxy/dspot/SpotifyManager.kt
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      
