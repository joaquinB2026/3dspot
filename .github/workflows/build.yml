name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v2
      - run: chmod +x gradlew
      - run: sed -i 's/SPOTIFY_CLIENT_ID_PLACEHOLDER/${{ secrets.SPOTIFY_CLIENT_ID }}/g' app/src/main/java/com/galaxy/dspot/SpotifyManager.kt
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: 3dspot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
